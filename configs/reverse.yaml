dataset:
  order: "reverse"

  tasks:
    forward: ["blca", "ucec", "luad", "brca"]
    reverse: ["brca", "luad", "ucec", "blca"]
    other: ["luad", "blca", "ucec", "brca"]

  blca:
    csv: "/datastore/uittogether3/LuuTru/Vutm/BCMM/data/tcga_blca_all_clean.csv"
    features: "/datastore/uittogether3/LuuTru/Vutm/Features/TCGA-BLCA/10x_256px_0px_overlap/features_conch_v15/"
    splits: "/datastore/uittogether3/LuuTru/Vutm/BCMM/splits/TCGA_BLCA/"

  brca:
    csv: "/datastore/uittogether3/LuuTru/Vutm/BCMM/data/tcga_brca_all_clean.csv"
    features: "/datastore/uittogether3/LuuTru/Vutm/Features/TCGA-BRCA/10x_256px_0px_overlap/features_conch_v15/"
    splits: "/datastore/uittogether3/LuuTru/Vutm/BCMM/splits/TCGA_BRCA/"

  luad:
    csv: "/datastore/uittogether3/LuuTru/Vutm/BCMM/data/tcga_luad_all_clean.csv"
    features: "/datastore/uittogether3/LuuTru/Vutm/Features/TCGA-LUAD/10x_256px_0px_overlap/features_conch_v15/"
    splits: "/datastore/uittogether3/LuuTru/Vutm/BCMM/splits/TCGA_LUAD/"

  ucec:
    csv: "/datastore/uittogether3/LuuTru/Vutm/BCMM/data/tcga_ucec_all_clean.csv"
    features: "/datastore/uittogether3/LuuTru/Vutm/Features/TCGA-UCEC/10x_256px_0px_overlap/features_conch_v15/"
    splits: "/datastore/uittogether3/LuuTru/Vutm/BCMM/splits/TCGA_UCEC/"
    
survival:
  time_col: "survival_months"
  event_col: "censorship"
  event_observed_value: 1
  num_prompt_bins: 5
  boundary_quantiles: [0.2, 0.4, 0.6, 0.8]
  cox_eps: 1.0e-7
  prompt_temperature: 0.07
  ordinal_temperature: 1.0

dataloader:
  batch_size: 8
  num_workers: 8

training:
  num_folds: 5
  num_tasks: 4
  num_epochs: 20
  train_num_patches: 1000
  lr: 1.0e-5
  head_lr: 1.0e-4
  weight_decay: 1.0e-4
  seed: 0

  survival_hidden_dim: 512
  survival_dropout: 0.25

  save_head: true
  
  # Original OPCM
  opcm_original_alpha: 0.5
  
  # Task Arithmetic
  task_arithmetic_scaling_factor: 0.3
  
  # TIES
  ties_scaling_factor: 0.3
  ties_threshold: 20
  ties_merge_func: sum
  
  # DOP
  dop_lr: 1.0e-4
  dop_num_steps: 200
  dop_mgda: true
  dop_alpha: 0.8
  dop_ema: true
  dop_ema_beta: 0.999
  dop_svd_epsilon: 0.99999
  dop_svd_proj_space: uv
  
  # NUFILT
  nufilt_seed: 42
  nufilt_null_space: true
  nufilt_lora_layers:
    - attn
    - fc1
  nufilt_lr: 1.0e-3
  nufilt_max_steps: 50
  nufilt_lora_r: 64
  nufilt_grad_r: 8
  nufilt_null_r: 128

  # DARE + Task Arithmetic
  dare_drop_rate: 0.9
  dare_scaling_factor: 0.3
  dare_seed: 42

evaluation:
  mode: "task_il"
  test_num_patches: 1000

paths:
  finetuned_checkpoints: "./outputs/finetuned"
  merged_checkpoints: "./outputs/merged/reverse"
